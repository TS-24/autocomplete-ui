name: autocomplete-ui

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "6080:6080" # noVNC web client → http://localhost:6080/vnc.html
      - "5900:5900" # raw VNC (optional)
    environment:
      - DISPLAY=:99
      - WEBKIT_DISABLE_COMPOSITING_MODE=1
      - WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
      - LIBGL_ALWAYS_SOFTWARE=1
    volumes:
      - app-data:/data
    shm_size: "1g"

volumes:
  app-data:
